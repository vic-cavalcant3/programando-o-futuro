<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Programando o Futuro</title>
  <link rel="stylesheet" href="../styles/global.css" />
  <link rel="stylesheet" href="../styles/fonts.css" />
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Manrope', sans-serif;
      background: #060d1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      overflow-y: auto;
    }

    /* BG decorativo */
    .bg-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .bg-glow::before {
      content: '';
      position: absolute;
      top: -100px; left: -100px;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(37,99,235,0.18) 0%, transparent 65%);
    }
    .bg-glow::after {
      content: '';
      position: absolute;
      bottom: -150px; right: -100px;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(56,189,248,0.07) 0%, transparent 65%);
    }

    /* Elementos decorativos laterais */
    .deco-left {
      position: fixed;
      left: 2.5rem; bottom: 35%;
      display: flex; flex-direction: column; gap: 0.4rem;
      z-index: 1;
    }
    .deco-left span {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.65rem;
      color: rgba(59,130,246,0.4);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .deco-right {
      position: fixed;
      right: 2.5rem; top: 45%;
      transform: translateY(-50%);
      display: flex; flex-direction: column; gap: 0.4rem;
      text-align: right;
      z-index: 1;
    }
    .deco-right span {
      font-size: 0.65rem;
      color: rgba(59,130,246,0.4);
      letter-spacing: 0.06em;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* Shield icon direito */
    .deco-shield {
      position: fixed;
      right: 2.5rem; top: 55%;
      z-index: 1;
      opacity: 0.35;
    }

    /* NAVBAR */
    .auth-nav {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.4rem 2.5rem;
    }
    .auth-nav .logo {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      color: #f0f6ff;
      text-decoration: none;
    }
    .auth-nav .back-arrow {
      color: rgba(255,255,255,0.7);
      text-decoration: none;
      font-size: 1.4rem;
      transition: color 0.2s;
    }
    .auth-nav .back-arrow:hover { color: #fff; }

    /* MAIN */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      position: relative;
      z-index: 2;
    }

    /* CARD */
    .auth-card {
      background: rgba(17,24,39,0.85);
      border: 1px solid rgba(255,255,255,0.07);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 2.8rem 2.5rem;
      width: 100%;
      max-width: 440px;
      animation: fadeUp 0.6s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .auth-card h1 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      color: #f0f6ff;
      margin-bottom: 0.6rem;
      letter-spacing: -0.02em;
    }
    .auth-card .subtitle {
      font-size: 0.9rem;
      color: rgba(255,255,255,0.55);
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .auth-alert {
      display: none;
      width: 100%;
      background: rgba(220,38,38,0.12);
      border: 1px solid rgba(220,38,38,0.28);
      border-radius: 12px;
      padding: 0.75rem 1rem;
      margin-bottom: 1.2rem;
      color: #fca5a5;
      font-family: 'Manrope', sans-serif;
      font-size: 0.84rem;
      font-weight: 600;
      line-height: 1.4;
      text-align: center;
    }

    /* FORM */
    .form-group {
      margin-bottom: 1.2rem;
    }
    .form-group label {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
      margin-bottom: 0.5rem;
    }
    .form-group .label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }
    .form-group .label-row a {
      font-size: 0.78rem;
      color: #3b82f6;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s;
    }
    .form-group .label-row a:hover { color: #60a5fa; }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-wrap .input-icon {
      position: absolute;
      left: 1rem;
      color: rgba(255,255,255,0.3);
      display: flex;
      align-items: center;
    }
    .input-wrap input {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 0.85rem 1rem 0.85rem 2.8rem;
      color: #f0f6ff;
      font-family: 'Manrope', sans-serif;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .input-wrap input::placeholder { color: rgba(255,255,255,0.25); }
    .input-wrap input:focus {
      border-color: rgba(59,130,246,0.5);
      background: rgba(59,130,246,0.05);
    }
    .input-wrap .toggle-pass {
      position: absolute;
      right: 1rem;
      background: none;
      border: none;
      color: rgba(255,255,255,0.35);
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: color 0.2s;
    }
    .input-wrap .toggle-pass:hover { color: rgba(255,255,255,0.7); }

    /* BTN */
    .btn-submit {
      width: 100%;
      padding: 1rem;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: all 0.25s ease;
      letter-spacing: 0.01em;
    }
    .btn-submit:hover {
      background: #3b82f6;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(37,99,235,0.4);
    }

    /* FOOTER LINK */
    .auth-footer {
      text-align: center;
      margin-top: 1.8rem;
      font-size: 0.88rem;
      color: rgba(255,255,255,0.45);
    }
    .auth-footer a {
      color: #3b82f6;
      font-weight: 600;
      text-decoration: none;
      transition: color 0.2s;
    }
    .auth-footer a:hover { color: #60a5fa; }

    /* PAGE FOOTER */
    .page-footer {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 1.2rem;
      font-size: 0.7rem;
      color: rgba(255,255,255,0.2);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    @media (max-width: 480px) {
      .auth-card { padding: 2rem 1.4rem; }
      .deco-left, .deco-right, .deco-shield { display: none; }
    }
  </style>
</head>
<body>

  <div class="bg-glow"></div>

  <!-- Decorativos laterais -->
  <div class="deco-left">
    <span>SYS_INIT_SEQUENCE</span>
    <span>SECURE_AUTH_V4.0</span>
  </div>
  <div class="deco-right">
    <span>U_LOCATION: LAT 0.00 / LONG 0.00</span>
  </div>
  <div class="deco-shield" title="Seguro">
    <svg width="22" height="22" fill="none" stroke="rgba(59,130,246,0.6)" stroke-width="1.5" viewBox="0 0 24 24">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      <polyline points="9 12 11 14 15 10"/>
    </svg>
  </div>

  <!-- NAV -->
  <nav class="auth-nav">
    <a href="../index.html" class="logo font-jakarta">Programando o Futuro</a>
    <a href="../index.html" class="back-arrow" title="Voltar">→</a>
  </nav>

  <!-- MAIN -->
  <main>
    <div class="auth-card">
      <h1 class="font-jakarta">Bem-vindo de volta</h1>
      <p class="subtitle font-manrope">Acesse sua conta para continuar sua jornada na tecnologia.</p>

      <div class="form-group">
        <label class="font-jakarta">E-mail</label>
        <div class="input-wrap">
          <span class="input-icon">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <rect x="2" y="4" width="20" height="16" rx="2"/>
              <path d="m22 7-10 7L2 7"/>
            </svg>
          </span>
          <input type="email" id="email" placeholder="seu@email.com" autocomplete="email" />
        </div>
      </div>

      <div class="form-group">
        <div class="label-row">
          <label class="font-jakarta">Senha</label>
          <a href="#">Esqueceu a senha?</a>
        </div>
        <div class="input-wrap">
          <span class="input-icon">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <rect x="3" y="11" width="18" height="11" rx="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>
          <input type="password" id="pass" placeholder="••••••••" autocomplete="current-password" />
          <button class="toggle-pass" onclick="togglePass('pass', this)" type="button">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <button class="btn-submit font-jakarta" id="btnLogin" type="button">Entrar</button>

      <div class="auth-footer font-manrope">
        Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a>
      </div>
    </div>
  </main>

  <footer class="page-footer font-jakarta">© 2026 Programando o Futuro</footer>

  <script>
    function togglePass(id, btn) {
      const input = document.getElementById(id);
      input.type = input.type === 'password' ? 'text' : 'password';
    }
  </script>
  <script src="../js/api.js"></script>
  <script>
    const emailInput = document.getElementById('email');
    const senhaInput = document.getElementById('pass');
    const btnLogin = document.getElementById('btnLogin');
    const textoBotaoLogin = btnLogin.innerHTML;

    function mensagemErroApi(error, fallback) {
      return error?.detail?.erro || error?.erro || error?.detail || fallback;
    }

    async function fazerLogin() {
      hideErro();

      const email = emailInput.value.trim();
      const senha = senhaInput.value;

      if (!email || !senha) {
        showErro('Preencha e-mail e senha para entrar.');
        return;
      }

      setLoading(btnLogin, true, textoBotaoLogin);

      try {
        await authApi.login(email, senha);
        await redirecionarUsuarioLogado();
      } catch (error) {
        showErro(mensagemErroApi(error, 'Não foi possível fazer login. Verifique os dados e tente novamente.'));
      } finally {
        setLoading(btnLogin, false, textoBotaoLogin);
      }
    }

    btnLogin.addEventListener('click', fazerLogin);

    [emailInput, senhaInput].forEach((input) => {
      input.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') fazerLogin();
      });
    });

    redirecionarUsuarioLogado({ silencioso: true });
  </script>
</body>
</html>
