<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />

  <link rel="stylesheet" href="../styles/global.css" />

  <style>
    * { box-sizing: border-box; }
    .navbar { position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 1rem 0; background: rgba(6,11,20,0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.06); transition: all 0.3s; }
    .navbar.scrolled { padding: 0.7rem 0; background: rgba(6,11,20,0.98); }
    .navbar .container { display: flex; align-items: center; justify-content: space-between; max-width: 1200px; margin: 0 auto; padding: 0 2rem; flex-wrap: nowrap; }
    .nav-logo { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 1rem; color: #f0f6ff; text-decoration: none; flex-shrink: 0; }
    .nav-links { display: flex; gap: 2.2rem; list-style: none; }
    .nav-links a { font-family: 'Manrope', sans-serif; font-size: 0.88rem; color: rgba(255,255,255,0.55); text-decoration: none; transition: color 0.2s; position: relative; }
    .nav-links a.active { color: #f0f6ff; }
    .nav-links a.active::after { content: ''; position: absolute; bottom: -4px; left: 0; right: 0; height: 2px; background: #2563eb; border-radius: 2px; }
    .nav-links a:hover { color: #f0f6ff; }
    .nav-user { display: flex; align-items: center; gap: 0.8rem; }
    .nav-user span { font-family: 'Manrope', sans-serif; font-size: 0.88rem; color: rgba(255,255,255,0.6); }
    .nav-avatar { width: 36px; height: 36px; background: #2563eb; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 0.8rem; color: #fff; cursor: pointer; }
    .btn-hamburger { display: none; background: none; border: none; color: #f0f6ff; cursor: pointer; align-items: center; }
    main { max-width: 1200px; margin: 0 auto; padding: 110px 2rem 4rem; }

    /* HERO */
    .hero { margin-bottom: 2.5rem; }
    .hero-label { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.68rem; font-weight: 700; color: #3b82f6; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 0.6rem; }
    .hero-title { font-family: 'Plus Jakarta Sans', sans-serif; font-size: clamp(2rem, 5vw, 3rem); font-weight: 900; color: #f0f6ff; letter-spacing: -0.03em; line-height: 1.1; margin-bottom: 0.8rem; }
    .hero-title span { color: #3b82f6; }
    .hero-desc { font-family: 'Manrope', sans-serif; font-size: 0.9rem; color: rgba(255,255,255,0.45); line-height: 1.7; max-width: 520px; }

    /* ÁREA CHIP */
    .area-chip { display: inline-flex; align-items: center; gap: 0.6rem; padding: 0.5rem 1rem; background: rgba(37,99,235,0.12); border: 1px solid rgba(37,99,235,0.25); border-radius: 20px; margin-top: 1rem; }
    .area-chip-label { font-family: 'Manrope', sans-serif; font-size: 0.78rem; color: rgba(255,255,255,0.4); }
    .area-chip-value { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.82rem; font-weight: 700; color: #60a5fa; }

    /* BUSCA */
    .search-bar { display: flex; gap: 0.8rem; margin-bottom: 2rem; flex-wrap: wrap; }
    .search-input { flex: 1; min-width: 200px; padding: 0.75rem 1rem; background: rgba(17,24,39,0.9); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; color: #f0f6ff; font-family: 'Manrope', sans-serif; font-size: 0.88rem; transition: border-color 0.2s; }
    .search-input:focus { outline: none; border-color: rgba(37,99,235,0.4); }
    .search-input::placeholder { color: rgba(255,255,255,0.25); }
    .btn-buscar { padding: 0.75rem 1.5rem; background: #2563eb; color: #fff; border: none; border-radius: 12px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.85rem; font-weight: 700; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
    .btn-buscar:hover { background: #3b82f6; }

    /* ESTADO */
    .state-box { text-align: center; padding: 4rem 2rem; }

    /* GRID */
    .cards-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.2rem; margin-bottom: 2rem; }
    .job-card {
  background: rgba(17,24,39,0.9);

  border-radius: 16px;
  padding: 1.25rem;
  display: flex;
  flex-direction: column;
  gap: 12px;
  transition: border-color 0.2s;
}
.job-card:hover {
  border-color: rgba(255,255,255,0.13);
}

.job-header {

  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}

.job-info { flex: 1; min-width: 0; }

.job-company {

}
.job-badges {

  gap: 6px;

  justify-content: flex-end;
  flex-shrink: 0;
}
    
    .job-icon { width: 42px; height: 42px; background: rgba(37,99,235,0.12); border: 1px solid rgba(37,99,235,0.2); border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.job-badge {

  white-space: nowrap;

  text-transform: uppercase;
  border: none;
}    

.badge-aprendiz   { background: rgba(139,92,246,0.15); color: #c4b5fd; }
.badge-estagio    { background: rgba(16,185,129,0.15); color: #6ee7b7; }
.badge-certificacao { background: rgba(245,158,11,0.15); color: #fcd34d; }
.badge-concurso   { background: rgba(239,68,68,0.15); color: #fca5a5; }
.badge-gratuito   { background: rgba(37,99,235,0.15); color: #93c5fd; }
.job-desc {

}
.job-como-acessar {

}
.como-label {

/* Mobile */
@media (max-width: 600px) {

  <script>
    window.addEventListener('scroll', () => {
      document.getElementById('navbar').classList.toggle('scrolled', window.scrollY > 40);
    });

    const fn = n => String(n||'').trim().split(/\s+/)[0]||'aluno';
    const ini = n => String(n||'').trim().split(/\s+/).filter(Boolean).slice(0,2).map(p=>p[0].toUpperCase()).join('')||'PF';

    function mostrarEstado(loading, msg) {
      const box = document.getElementById('stateBox');
      const loader = document.getElementById('loader');
      const stateMsg = document.getElementById('stateMsg');
      if (!msg && !loading) { box.style.display = 'none'; return; }
      box.style.display = 'block';
      loader.style.display = loading ? 'block' : 'none';
      stateMsg.textContent = msg || '';
    }

    function escHtml(str) {
      return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function renderVagas(vagas) {
      const grid = document.getElementById('cardsGrid');
      grid.innerHTML = '';

      if (!vagas || vagas.length === 0) {
        mostrarEstado(false, 'Nenhuma oportunidade encontrada. Tente buscar por outra área.');
        return;
      }
      mostrarEstado(false, '');

      const tipoLabel = {
        aprendiz: 'Jovem Aprendiz',
        estagio: 'Estágio',
        certificacao: 'Certificação',
        concurso: 'Concurso Público'
      };
      const tipoColor = {
        aprendiz: 'badge-aprendiz',
        estagio: 'badge-estagio',
        certificacao: 'badge-certificacao',
        concurso: 'badge-concurso'
      };

      vagas.forEach(v => {
        const card = document.createElement('div');
        card.className = 'job-card';
        card.innerHTML = `
          <div class="job-header">
            <div class="job-info">
              <div class="job-title font-jakarta">${escHtml(v.titulo || '')}</div>
              <div class="job-company font-manrope">${escHtml(v.empresa || '')}</div>
            </div>
            <div class="job-badges">
              <span class="job-badge ${tipoColor[v.tipo] || 'badge-presencial'} font-jakarta">${tipoLabel[v.tipo] || escHtml(v.tipo || '')}</span>
              ${v.gratuito ? '<span class="job-badge badge-gratuito font-jakarta">Gratuito</span>' : ''}
            </div>
          </div>
          <p class="job-desc font-manrope">${escHtml(v.descricao || '')}</p>
          <div class="job-como-acessar font-manrope">
            <span class="como-label">Como acessar:</span>${escHtml(v.comoAcessar || '')}
          </div>
        `;
        grid.appendChild(card);
      });
    }

    async function buscarVagas(profissaoAuto) {
      const query = profissaoAuto || document.getElementById('searchInput').value.trim();
      if (!query) return;
      const btn = document.getElementById('btnBuscar');
      btn.disabled = true;
      mostrarEstado(true, 'Buscando oportunidades...');
      document.getElementById('cardsGrid').innerHTML = '';
      try {
        const vagas = await api.post('/api/vagas', { profissao: query, localizacao: 'Brasil' });
        renderVagas(vagas);
      } catch (err) {
        mostrarEstado(false, 'Erro ao buscar oportunidades. Verifique sua conexão e tente novamente.');
      } finally {
        btn.disabled = false;
      }
    }

    document.getElementById('searchInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') buscarVagas();
    });

    async function carregarPagina() {
      const usuario = await paginaProtegida;
      if (!usuario) return;
      document.getElementById('navGreeting').textContent = `Olá, ${fn(usuario.nome)}`;
      document.getElementById('navAvatar').textContent = usuario.avatar_iniciais || ini(usuario.nome);
      try {
        const perfil = await perfilApi.get();
        const area = perfil.areaPrincipal || '';
        if (area) {
          document.getElementById('heroArea').textContent = area;
          document.getElementById('areaChipValue').textContent = area;
          document.getElementById('areaChip').style.display = 'inline-flex';
          document.getElementById('searchInput').value = area;
          await buscarVagas(area);
        } else {
          mostrarEstado(false, 'Complete seu perfil para ver oportunidades personalizadas.');
        }
      } catch {
        mostrarEstado(false, 'Complete o questionário para ver oportunidades da sua área.');
      }
    }

    carregarPagina();

    function abrirPerfil() {
      const u = auth.getUser();
      if (!u) return;
      document.getElementById('perfilAvatar').textContent = u.avatar_iniciais||'??';
      document.getElementById('perfilNomeDisplay').textContent = u.nome||'';
      document.getElementById('perfilEmailDisplay').textContent = u.email||'';
      document.getElementById('perfilNomeInput').value = u.nome||'';
      document.getElementById('perfilEmailInput').value = u.email||'';
      document.getElementById('perfilCidadeInput').value = u.cidade||'';
      document.getElementById('perfilSenhaAtual').value = '';
      document.getElementById('perfilSenhaNova').value = '';
      document.getElementById('perfilMsg').textContent = '';
      document.getElementById('perfilOverlay').classList.add('open');
    }
    function fecharPerfil(e) {
      if (!e || e.target === document.getElementById('perfilOverlay')) document.getElementById('perfilOverlay').classList.remove('open');
    }
    async function salvarPerfil() {
      const msgEl = document.getElementById('perfilMsg');
      msgEl.textContent = 'Salvando...'; msgEl.className = 'perfil-msg font-manrope';
      try {
        const dados = { nome: document.getElementById('perfilNomeInput').value.trim(), email: document.getElementById('perfilEmailInput').value.trim(), cidade: document.getElementById('perfilCidadeInput').value.trim() };
        const sa = document.getElementById('perfilSenhaAtual').value;
        const sn = document.getElementById('perfilSenhaNova').value;
        if (sn) { dados.senha_atual = sa; dados.senha_nova = sn; }
        const u = await authApi.atualizarPerfil(dados);
        auth.setUser(u);
        document.getElementById('perfilAvatar').textContent = u.avatar_iniciais||'??';
        document.getElementById('perfilNomeDisplay').textContent = u.nome||'';
        document.getElementById('perfilEmailDisplay').textContent = u.email||'';
        const na = document.getElementById('navAvatar'); const ng = document.getElementById('navGreeting');
        if (na) na.textContent = u.avatar_iniciais||'??';
        if (ng) ng.textContent = `Olá, ${u.nome.split(' ')[0]}`;
        msgEl.textContent = 'Salvo!'; msgEl.className = 'perfil-msg font-manrope ok';
      } catch (err) { msgEl.textContent = err?.erro||'Erro ao salvar.'; msgEl.className = 'perfil-msg font-manrope erro'; }
    }
    function sairDaConta() { authApi.logout(); }
  </script>
</body>
</html>
