<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teste de Perfil — Programando o Futuro</title>
  <link rel="stylesheet" href="../styles/global.css" />
  <link rel="stylesheet" href="../styles/fonts.css" />
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
  <style>
    body {
      font-family: 'Manrope', sans-serif;
      background: #060b14;
      min-height: 100vh;
      display: flex; flex-direction: column;
    }

    .bg-glow {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
    }
    .bg-glow::before {
      content: '';
      position: absolute; top: -100px; left: 50%; transform: translateX(-50%);
      width: 600px; height: 500px;
      background: radial-gradient(ellipse, rgba(37,99,235,0.1) 0%, transparent 65%);
    }

    /* NAV */
    .test-nav {
      position: relative; z-index: 10;
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.2rem 2.5rem;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .nav-logo {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700; font-size: 0.95rem; color: #f0f6ff;
      text-decoration: none;
    }
    .nav-progress-text {
        display: flex;
        justify-content: right;
        margin-right: 5rem;
        margin-top: 1rem;
        gap: 0.3rem;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1rem; font-weight: 700;
      color: rgba(255,255,255,0.4);
    }
    .nav-progress-text span { color: #3b82f6; }
    .btn-sair {
      font-family: 'Manrope', sans-serif;
      font-size: 0.78rem; color: rgba(255,255,255,0.3);
      text-decoration: none; transition: color 0.2s;
    }
    .btn-sair:hover { color: rgba(255,255,255,0.7); }

    /* PROGRESS BAR */
    .progress-bar-wrap {
      position: relative; z-index: 10;
      padding: 0 2.5rem;
      background: rgba(6,11,20,0.9);
    }
    .progress-bar-bg {
      width: 100%; height: 3px;
      background: rgba(255,255,255,0.06);
      border-radius: 2px; overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%; background: #2563eb;
      border-radius: 2px;
      transition: width 0.5s ease;
    }

    /* MAIN */
    main {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 2rem; position: relative; z-index: 1;
    }

    .question-wrap {
      max-width: 620px; width: 100%;
    }

    /* Pergunta */
    .question-card {
      animation: fadeSlide 0.4s ease both;
    }
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateX(30px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    @keyframes fadeSlideBack {
      from { opacity: 0; transform: translateX(-30px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .question-card.going-back {
      animation: fadeSlideBack 0.4s ease both;
    }

    .question-num {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.68rem; font-weight: 700;
      color: #3b82f6; letter-spacing: 0.1em; text-transform: uppercase;
      margin-bottom: 1rem;
    }
    .question-text {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: clamp(1.3rem, 3vw, 1.7rem);
      font-weight: 800; color: #f0f6ff;
      line-height: 1.3; margin-bottom: 2rem;
      letter-spacing: -0.02em;
    }

    /* Opções */
    .options-list {
      display: flex; flex-direction: column; gap: 0.8rem;
      margin-bottom: 2rem;
    }
    .option-btn {
      width: 100%; padding: 1rem 1.2rem;
      background: rgba(17,24,39,0.8);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px; text-align: left;
      font-family: 'Manrope', sans-serif;
      font-size: 0.9rem; font-weight: 500; color: rgba(255,255,255,0.7);
      cursor: pointer; transition: all 0.2s;
      display: flex; align-items: center; gap: 1rem;
    }
    .option-btn:hover {
      border-color: rgba(37,99,235,0.4);
      background: rgba(37,99,235,0.06);
      color: #f0f6ff;
    }
    .option-btn.selected {
      border-color: #2563eb;
      background: rgba(37,99,235,0.12);
      color: #f0f6ff;
    }
    .option-letter {
      width: 28px; height: 28px; flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.72rem; font-weight: 700;
      color: rgba(255,255,255,0.4);
      transition: all 0.2s;
    }
    .option-btn.selected .option-letter {
      background: #2563eb; border-color: #2563eb; color: #fff;
    }
    .option-btn:hover .option-letter {
      border-color: rgba(37,99,235,0.5);
      color: rgba(255,255,255,0.7);
    }

    /* Navegação */
    .nav-btns {
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    }
    .btn-voltar {
      display: flex; align-items: center; gap: 0.4rem;
      padding: 0.75rem 1.4rem;
      background: transparent; color: rgba(255,255,255,0.4);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.85rem; font-weight: 600;
      cursor: pointer; transition: all 0.2s;
    }
    .btn-voltar:hover {
      border-color: rgba(255,255,255,0.25);
      color: rgba(255,255,255,0.7);
    }
    .btn-voltar:disabled { opacity: 0.3; cursor: not-allowed; }

    .btn-proximo {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.75rem 1.8rem;
      background: #2563eb; color: #fff;
      border: none; border-radius: 12px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.9rem; font-weight: 700;
      cursor: pointer; transition: all 0.25s;
      opacity: 0.4; pointer-events: none;
    }
    .btn-proximo.enabled {
      opacity: 1; pointer-events: all;
    }
    .btn-proximo.enabled:hover {
      background: #3b82f6; transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(37,99,235,0.4);
    }

    /* FOOTER */
    .page-footer {
      position: relative; z-index: 2;
      text-align: center; padding: 1rem;
      font-size: 0.7rem; color: rgba(255,255,255,0.15);
      letter-spacing: 0.08em; text-transform: uppercase;
    }

    @media (max-width: 600px) {
      .test-nav { padding: 1rem 1.2rem; }
      .progress-bar-wrap { padding: 0 1.2rem; }
      .question-text { font-size: 1.2rem; }
      .option-btn { font-size: 0.82rem; padding: 0.85rem 1rem; }
         .nav-progress-text {
        display: flex;
        justify-content: right;
        margin-right: 2rem;
        margin-top: 1rem;
        gap: 0.3rem;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.7rem; font-weight: 700;
      color: rgba(255,255,255,0.4);
    }
    }
  </style>
</head>
<body>

  <div class="bg-glow"></div>

  <!-- NAV -->
  <nav class="test-nav">
    <a href="inicial_mapa_feito.html" class="nav-logo font-jakarta">Programando o Futuro</a>

    <a href="inicial_mapa_feito.html" class="btn-sair font-manrope">Salvar e Sair</a>
  </nav>

  <!-- PROGRESS BAR -->
  <div class="progress-bar-wrap">
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressBar" style="width: 10%"></div>
    </div>
  </div>
      <span class="nav-progress-text font-jakarta">
      Pergunta <span id="navCurrent">1</span> de <span id="navTotal">10</span>
    </span>

  <!-- MAIN -->
  <main>
    <div class="question-wrap">
      <div class="question-card" id="questionCard">

        <div class="question-num font-jakarta" id="questionNum">Pergunta 01</div>
        <h2 class="question-text font-jakarta" id="questionText"></h2>

        <div class="options-list" id="optionsList"></div>

        <div class="nav-btns">
          <button class="btn-voltar font-jakarta" id="btnVoltar" onclick="voltarPergunta()">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path d="M19 12H5M12 5l-7 7 7 7"/>
            </svg>
            Voltar
          </button>
          <button class="btn-proximo font-jakarta" id="btnProximo" onclick="proximaPergunta()">
            Próxima
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </button>
        </div>

      </div>
    </div>
  </main>

  <footer class="page-footer font-jakarta">© 2026 Programando o Futuro</footer>

  <script>
    /*
      TODO BACK-END:
      As perguntas abaixo são placeholder.
      Substituir por: GET /api/teste/perguntas → retorna array de perguntas
      
      Cada pergunta deve ter:
      - id (number)
      - texto (string)
      - opcoes: [{ letra, texto, valor }]
      
      As respostas devem ser enviadas para:
      POST /api/teste/respostas → { userId, respostas: [{ perguntaId, valor }] }
      
      Após envio → redirecionar para resultado.html
    */
    const perguntas = [
  {
    id: 1,
    texto: "O que você mais gosta de fazer quando tem total liberdade de escolha?",
    opcoes: [
      { letra: "A", texto: "Cuidar, ajudar ou ensinar alguém" },
      { letra: "B", texto: "Criar, desenhar ou construir algo" },
      { letra: "C", texto: "Analisar, calcular ou resolver problemas" },
      { letra: "D", texto: "Organizar, planejar ou liderar pessoas" }
    ]
  },
  {
    id: 2,
    texto: "Qual dessas áreas mais desperta sua curiosidade naturalmente?",
    opcoes: [
      { letra: "A", texto: "Saúde, corpo humano e bem-estar" },
      { letra: "B", texto: "Tecnologia, sistemas e inovação" },
      { letra: "C", texto: "Negócios, mercado e finanças" },
      { letra: "D", texto: "Arte, cultura e comunicação" }
    ]
  },
  {
    id: 3,
    texto: "Como as pessoas ao seu redor costumam te descrever?",
    opcoes: [
      { letra: "A", texto: "Empático, acolhedor e atencioso com as pessoas" },
      { letra: "B", texto: "Criativo, curioso e cheio de ideias" },
      { letra: "C", texto: "Lógico, analítico e bom em resolver problemas" },
      { letra: "D", texto: "Organizado, determinado e bom em liderar" }
    ]
  },
  {
    id: 4,
    texto: "Qual matéria escolar você tinha mais facilidade e gostava?",
    opcoes: [
      { letra: "A", texto: "Biologia e ciências da natureza" },
      { letra: "B", texto: "Matemática, física ou informática" },
      { letra: "C", texto: "História, filosofia ou sociologia" },
      { letra: "D", texto: "Artes, redação ou línguas" }
    ]
  },
  {
    id: 5,
    texto: "Qual dessas atividades você faria mesmo sem receber nada?",
    opcoes: [
      { letra: "A", texto: "Cuidar de pessoas, animais ou do meio ambiente" },
      { letra: "B", texto: "Programar, montar ou inventar coisas" },
      { letra: "C", texto: "Ensinar, explicar ou compartilhar conhecimento" },
      { letra: "D", texto: "Criar conteúdo, arte, design ou música" }
    ]
  },
  {
    id: 6,
    texto: "Qual dessas imagens mais representa onde você se vê trabalhando?",
    opcoes: [
      { letra: "A", texto: "Hospital, clínica, escola ou ONG" },
      { letra: "B", texto: "Empresa de tecnologia ou laboratório" },
      { letra: "C", texto: "Escritório corporativo ou próprio negócio" },
      { letra: "D", texto: "Estúdio criativo, agência ou home office" }
    ]
  },
  {
    id: 7,
    texto: "O que te daria mais orgulho de ouvir sobre seu trabalho?",
    opcoes: [
      { letra: "A", texto: "Que você mudou a vida de alguém para melhor" },
      { letra: "B", texto: "Que você criou algo que muita gente usa ou admira" },
      { letra: "C", texto: "Que você é referência técnica na sua área" },
      { letra: "D", texto: "Que você construiu um negócio ou liderou grandes projetos" }
    ]
  },
  {
    id: 8,
    texto: "Como você prefere aprender algo novo?",
    opcoes: [
      { letra: "A", texto: "Praticando direto, aprendendo pelo erro" },
      { letra: "B", texto: "Estudando a teoria antes de começar" },
      { letra: "C", texto: "Vendo alguém fazer e depois repetindo" },
      { letra: "D", texto: "Discutindo e trocando ideias com outras pessoas" }
    ]
  },
  {
    id: 9,
    texto: "Qual dessas frases mais combina com o que você busca na vida?",
    opcoes: [
      { letra: "A", texto: "Quero fazer a diferença na vida das pessoas" },
      { letra: "B", texto: "Quero criar coisas que o mundo ainda não tem" },
      { letra: "C", texto: "Quero ser o melhor no que faço tecnicamente" },
      { letra: "D", texto: "Quero ter liberdade, tempo e dinheiro para viver bem" }
    ]
  },
  {
    id: 10,
    texto: "Se você pudesse escolher agora, qual caminho seguiria?",
    opcoes: [
      { letra: "A", texto: "Faculdade na área de saúde ou humanas" },
      { letra: "B", texto: "Faculdade ou curso técnico em tecnologia ou engenharia" },
      { letra: "C", texto: "Faculdade em negócios, direito ou administração" },
      { letra: "D", texto: "Curso livre, técnico ou faculdade em artes e comunicação" }
    ]
  }
];
    // Estado
    let currentQ = 1;
    let respostas = {};

    // Lê ?q= da URL
    const params = new URLSearchParams(window.location.search);
    const qParam = parseInt(params.get('q'));
    if (qParam && qParam >= 1 && qParam <= perguntas.length) {
      currentQ = qParam;
    }

    // Carrega respostas salvas
    // TODO BACK-END: substituir localStorage por GET /api/teste/respostas/:userId
    const saved = localStorage.getItem('pf_respostas');
    if (saved) respostas = JSON.parse(saved);

    function renderPergunta(going_back = false) {
      const q = perguntas[currentQ - 1];
      const card = document.getElementById('questionCard');

      card.className = 'question-card' + (going_back ? ' going-back' : '');

      // Atualiza textos
      document.getElementById('questionNum').textContent = `Pergunta ${String(currentQ).padStart(2, '0')}`;
      document.getElementById('questionText').textContent = q.texto;
      document.getElementById('navCurrent').textContent = currentQ;
      document.getElementById('navTotal').textContent = perguntas.length;
      document.getElementById('progressBar').style.width = `${(currentQ / perguntas.length) * 100}%`;

      // Botão voltar
      const btnVoltar = document.getElementById('btnVoltar');
      btnVoltar.disabled = currentQ === 1;

      // Renderiza opções
      const list = document.getElementById('optionsList');
      list.innerHTML = '';
      q.opcoes.forEach(op => {
        const btn = document.createElement('button');
        btn.className = 'option-btn font-manrope' + (respostas[currentQ] === op.letra ? ' selected' : '');
        btn.innerHTML = `
          <div class="option-letter font-jakarta">${op.letra}</div>
          <span>${op.texto}</span>
        `;
        btn.onclick = () => selecionarOpcao(op.letra);
        list.appendChild(btn);
      });

      atualizarBtnProximo();

      // Atualiza URL sem reload
      history.replaceState(null, '', `?q=${currentQ}`);
    }

    function selecionarOpcao(letra) {
      respostas[currentQ] = letra;
      // TODO BACK-END: salvar resposta parcial → PATCH /api/teste/respostas/:userId { perguntaId: currentQ, valor: letra }
      localStorage.setItem('pf_respostas', JSON.stringify(respostas));

      // Atualiza visual
      document.querySelectorAll('.option-btn').forEach(btn => btn.classList.remove('selected'));
      event.currentTarget.classList.add('selected');
      atualizarBtnProximo();

      // Auto avança após 300ms
    //   setTimeout(() => {
    //     if (currentQ < perguntas.length) proximaPergunta();
    //     else finalizarTeste();
    //   }, 350);
    }

    function atualizarBtnProximo() {
      const btn = document.getElementById('btnProximo');
      if (respostas[currentQ]) {
        btn.classList.add('enabled');
        btn.textContent = currentQ === perguntas.length ? 'Finalizar' : 'Próxima';
        if (currentQ < perguntas.length) {
          btn.innerHTML = `Próxima <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>`;
        } else {
          btn.innerHTML = `Finalizar <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>`;
        }
        btn.onclick = currentQ === perguntas.length ? finalizarTeste : proximaPergunta;
      } else {
        btn.classList.remove('enabled');
        btn.innerHTML = `Próxima <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>`;
        btn.onclick = proximaPergunta;
      }
    }

    function proximaPergunta() {
      if (!respostas[currentQ]) return;
      if (currentQ >= perguntas.length) { finalizarTeste(); return; }
      currentQ++;
      renderPergunta(false);
    }

    function voltarPergunta() {
      if (currentQ <= 1) return;
      currentQ--;
      renderPergunta(true);
    }

    function finalizarTeste() {
      /*
        TODO BACK-END:
        Enviar todas as respostas para a API antes de redirecionar.
        
        POST /api/teste/respostas
        Body: { userId, respostas: [{ perguntaId, valor }] }
        
        Após sucesso → redirecionar para resultado.html
        Em caso de erro → mostrar mensagem de erro
      */
      localStorage.setItem('pf_respostas', JSON.stringify(respostas));
      window.location.href = 'resultado.html';
    }

    // Init
    renderPergunta();
  </script>
  <script src="../js/api.js"></script>
  <script src="../js/questionario-api.js"></script>

</body>
</html>
