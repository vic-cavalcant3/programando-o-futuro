<!-- MODAL SUPORTE -->
<div class="suporte-overlay" id="suporteOverlay" onclick="fecharSuporte(event)">
  <div class="suporte-card">
    <button class="suporte-close" onclick="fecharSuporte()">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <div class="suporte-titulo font-jakarta">Fale com o Suporte</div>
    <div class="suporte-sub font-manrope">Preencha o formulário e retornaremos em até 2 dias úteis.</div>
    <div class="suporte-form-group">
      <label class="suporte-label font-jakarta">Nome</label>
      <input class="suporte-input font-manrope" id="suporteNome" type="text" placeholder="Seu nome">
    </div>
    <div class="suporte-form-group">
      <label class="suporte-label font-jakarta">E-mail</label>
      <input class="suporte-input font-manrope" id="suporteEmail" type="email" placeholder="seu@email.com">
    </div>
    <div class="suporte-form-group">
      <label class="suporte-label font-jakarta">Mensagem</label>
      <textarea class="suporte-input font-manrope" id="suporteMensagem" rows="4" placeholder="Descreva sua dúvida ou problema..."></textarea>
    </div>
    <div class="suporte-msg font-manrope" id="suporteMsg"></div>
    <button class="suporte-btn font-jakarta" onclick="enviarSuporte()">Enviar mensagem</button>
  </div>
</div>

<style>
.suporte-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); z-index: 500; align-items: center; justify-content: center; padding: 1.5rem; }
.suporte-overlay.open { display: flex; }
.suporte-card { background: #0d1424; border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 2rem; width: 100%; max-width: 440px; position: relative; }
.suporte-close { position: absolute; top: 1.2rem; right: 1.2rem; background: none; border: none; color: rgba(255,255,255,0.4); cursor: pointer; }
.suporte-close:hover { color: #fff; }
.suporte-titulo { font-size: 1.1rem; font-weight: 800; color: #f0f6ff; margin-bottom: 0.3rem; }
.suporte-sub { font-size: 0.82rem; color: rgba(255,255,255,0.4); margin-bottom: 1.5rem; }
.suporte-form-group { margin-bottom: 1rem; }
.suporte-label { display: block; font-size: 0.62rem; font-weight: 700; color: rgba(255,255,255,0.35); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 0.4rem; }
.suporte-input { width: 100%; padding: 0.7rem 0.9rem; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; color: #f0f6ff; font-size: 0.88rem; resize: vertical; box-sizing: border-box; }
.suporte-input:focus { outline: none; border-color: rgba(37,99,235,0.5); }
.suporte-btn { width: 100%; padding: 0.85rem; background: #2563eb; color: #fff; border: none; border-radius: 12px; font-size: 0.88rem; font-weight: 700; cursor: pointer; margin-top: 0.5rem; }
.suporte-btn:hover { background: #3b82f6; }
.suporte-msg { font-size: 0.78rem; text-align: center; min-height: 1.2rem; margin-bottom: 0.4rem; }
.suporte-msg.ok { color: #10b981; }
.suporte-msg.erro { color: #f87171; }
</style>


<script>
  function abrirSuporte(e) {
  if (e) e.preventDefault();
  document.getElementById('suporteOverlay').classList.add('open');
}
function fecharSuporte(e) {
  if (e && e.target !== document.getElementById('suporteOverlay')) return;
  document.getElementById('suporteOverlay').classList.remove('open');
  document.getElementById('suporteMsg').textContent = '';
  document.getElementById('suporteMsg').className = 'suporte-msg font-manrope';
}
async function enviarSuporte() {
  const nome = document.getElementById('suporteNome').value.trim();
  const email = document.getElementById('suporteEmail').value.trim();
  const mensagem = document.getElementById('suporteMensagem').value.trim();
  const msg = document.getElementById('suporteMsg');
  if (!nome || !email || !mensagem) {
    msg.textContent = 'Preencha todos os campos.';
    msg.className = 'suporte-msg font-manrope erro';
    return;
  }
  // Abre cliente de e-mail como fallback (sem backend de email configurado)
  const assunto = encodeURIComponent('Suporte - Programando o Futuro');
  const corpo = encodeURIComponent(`Nome: ${nome}\nE-mail: ${email}\n\n${mensagem}`);
  window.location.href = `mailto:contato@programandoofuturo.com.br?subject=${assunto}&body=${corpo}`;
  msg.textContent = 'Abrindo seu cliente de e-mail...';
  msg.className = 'suporte-msg font-manrope ok';
}
function compartilhar(e) {
  e.preventDefault();
  const url = window.location.origin;
  if (navigator.share) {
    navigator.share({ title: 'Programando o Futuro', text: 'Descubra sua área ideal com orientação vocacional por IA!', url });
  } else {
    navigator.clipboard.writeText(url).then(() => {
      alert('Link copiado para a área de transferência!');
    });
  }
}
</script>
